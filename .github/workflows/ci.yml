name: CI

# The job id `build` is the stable name of the required status check (convention
# C1): it aggregates the lint and test jobs, so the matrix below can change
# without renaming the check. No workflow-level `paths:` filter - a required
# check whose workflow does not start stays pending forever.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Lowest version the pinned dependencies support (aiohttp>=3.14.4 needs
        # Python >=3.10) and the latest stable one.
        python-version: ['3.10', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m py_compile stress_my_site.py

      - name: Test
        run: python -m pytest tests/ -v

  build:
    # Stable required-check name; fails if any job it depends on failed, was
    # cancelled or was skipped.
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint and test
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "lint: ${LINT_RESULT}"
          echo "test: ${TEST_RESULT}"
          [ "${LINT_RESULT}" = "success" ] && [ "${TEST_RESULT}" = "success" ]
