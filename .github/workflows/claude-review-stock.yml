name: Claude Review (stock trial)

# TRIAL, not a required check. Runs Anthropic's own PR-review setup from
# anthropics/claude-code-action (.github/workflows/claude-review.yml at v1.0.283)
# side by side with claude-code-review.yml, so both can be compared on the same PR.
# The command and the five reviewer agents are copied verbatim into
# .claude/commands/review-pr.md and .claude/agents/*-reviewer.md.
#
# Deviations from upstream, each forced by this repo:
# - Auth: CLAUDE_CODE_OAUTH_TOKEN instead of Workload Identity Federation
#   (no API organisation here), gated so the job is skipped without the secret.
# - Runner: ubuntu-latest instead of Anthropic's internal egress-firewall runner.
# - Trigger: also synchronize, so a push to a PR is reviewed again, and only on
#   PRs labelled review-stock-trial (see the job's `if`).
# - Model: current Opus instead of upstream's pinned claude-opus-4-7.
# - Actions pinned to commit SHAs (workflow-lint), execution log uploaded.
# Remove this file and the copied .claude files when the trial is over.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

concurrency:
  group: claude-review-stock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Upstream skips fork PRs; Dependabot gets no secrets either.
    # Opt-in per label: both workflows post as claude[bot], so on an ordinary PR the
    # required claude-review's "Fail on findings" would count this trial's comments.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'review-stock-trial')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check token
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set - skipping the review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: PR Review with Progress Tracking
        id: review
        if: steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          # --permission-mode auto: a tool call that needs permission and is outside --allowedTools
          # below and the allowed-tools list in .claude/commands/review-pr.md runs only if Claude
          # Code's safety review passes it.
          claude_args: |
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --model "claude-opus-5-5"

      - name: Collect execution log
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          src="$EXECUTION_FILE"
          [ -n "$src" ] && [ -f "$src" ] || src="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$src" ]; then
            cp "$src" "${RUNNER_TEMP}/claude-review-stock-log.json"
          else
            echo "No execution log found (looked at: $src)"
          fi

      - name: Upload execution log
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-stock-log
          path: ${{ runner.temp }}/claude-review-stock-log.json
          if-no-files-found: warn
