name: Claude Review (tiered trial)

# TRIAL, not a required check, only on PRs labelled review-trial-tiered.
#
# A tiered review with a fixed model per role. The code-review plugin names models
# for its subagents too, but the orchestrator decides whether to use them, and in
# rounds 1-2 Sonnet did nearly every step itself. Here each role is its own agent
# under .claude/agents/ with the model pinned in its frontmatter, and the
# orchestrator is told to delegate and never read the code itself:
#   review-triage      haiku   skip check + context (head SHA, guideline files)
#   review-guidelines  sonnet  CLAUDE.md compliance
#   review-bug-hunter  opus    2x in parallel, focus "diff" and "behaviour"
#   review-validator   opus    one per candidate finding, before anything is posted
# The orchestrator (Sonnet) merges, deduplicates and posts.
#
# Kept from claude-code-review.yml, each for the failure noted there: foreground
# subagents only (nagellacke #312), inline comments via the MCP tool named in
# --allowedTools (nagellacke #315), threads exported for the session (round 2),
# "Fail on findings", execution log upload.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

concurrency:
  group: claude-review-tiered-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'review-trial-tiered')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check token
        id: gate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set - skipping the review."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record start time
        id: start
        if: steps.gate.outputs.enabled == 'true'
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Export existing review threads
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # $owner/$name/$pr/$endCursor are GraphQL variables, not shell ones.
          # shellcheck disable=SC2016
          gh api graphql --paginate \
            -F owner="$OWNER" -F name="$NAME" -F pr="$PR" \
            -f query='
              query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 50, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved isOutdated path line
                        comments(first: 20) { nodes { author { login } body createdAt } }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]' \
            | jq -s '.' > "$GITHUB_WORKSPACE/.review-threads.json"
          echo "Exported $(jq length "$GITHUB_WORKSPACE/.review-threads.json") review thread(s)."

      - name: Run tiered review
        id: review
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude[bot]'
          prompt: |
            REPO: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}

            You orchestrate a code review of this pull request. You do not review code
            yourself: do not run `gh pr diff` and do not read source files. Every
            judgement comes from the subagents below, each of which already has its
            model set. Give every subagent the repository and PR number, and from step 2
            on also the PR title and description.

            This is a one-shot CI run: it ends when your turn ends, and nothing can
            deliver a result to you afterwards. Run every subagent in the foreground and
            wait for its result in the same turn, never in the background.

            1. Run review-triage. If it returns SKIP: yes, stop without posting anything.
            2. In one message, run three subagents in parallel: review-guidelines (with
               the GUIDELINE_FILES from step 1), review-bug-hunter with FOCUS diff, and
               review-bug-hunter with FOCUS behaviour.
            3. Merge their results and drop duplicates (same line and same cause).
            4. Read `.review-threads.json` in the repository root. Drop every candidate
               an open thread already covers, and every candidate matching a thread the
               author resolved without a code change - that one was dismissed on purpose.
               Keep a candidate whose earlier fix attempt does not actually resolve it.
            5. In one message, run one review-validator per remaining candidate, in
               parallel. Keep only CONFIRMED ones.
            6. Post each confirmed finding as an inline comment with
               mcp__github_inline_comment__create_inline_comment (confirmed: true) on the
               line the validator named: a short description, the failing case, and a
               committable suggestion only when it fixes the issue completely. Never post
               a finding as a general PR comment, not even for a line outside the diff -
               anchor it to the changed line that causes it and name the other file and
               line in the text.
            7. If nothing is left to post, post one comment with `gh pr comment` that
               starts verbatim with "No issues found" (first review of this PR) or
               "No new issues found" (open threads exist). Post nothing else: any other
               comment fails the check, so do not reply in threads to confirm fixes.
          claude_args: |
            --model "claude-sonnet-5-5"
            --disallowedTools "ScheduleWakeup,Monitor"
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Collect execution log
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          src="$EXECUTION_FILE"
          [ -n "$src" ] && [ -f "$src" ] || src="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$src" ]; then
            cp "$src" "${RUNNER_TEMP}/claude-review-tiered-log.json"
          else
            echo "No execution log found (looked at: $src)"
          fi

      - name: Upload execution log
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-tiered-log
          path: ${{ runner.temp }}/claude-review-tiered-log.json
          if-no-files-found: warn

      - name: Fail on findings
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          set -euo pipefail
          inline=$(gh api --paginate "repos/$REPO/pulls/$PR/comments?since=$SINCE" \
            --jq '.[] | select(.user.login == "claude[bot]" and .created_at >= env.SINCE) | .html_url')
          general=$(gh api --paginate "repos/$REPO/issues/$PR/comments?since=$SINCE" \
            --jq '.[] | select(.user.login == "claude[bot]" and .updated_at >= env.SINCE)
                  | select(.body | test("No (new )?issues found"; "i") | not) | .html_url')
          findings=$(printf '%s\n%s\n' "$inline" "$general" | sed '/^$/d')
          if [ -n "$findings" ]; then
            count=$(printf '%s\n' "$findings" | wc -l)
            echo "::error title=Claude review::${count} finding(s) in this run."
            printf '%s\n' "$findings"
            exit 1
          fi
          echo "No findings in this run."
