name: Secret Scan

# gitleaks over the PR diff. This is the only secret scanner a private repo has
# (GitHub secret scanning needs Advanced Security there); in a public repo it
# complements GitHub's free secret scanning and push protection.
#
# Runs on every PR without a `paths:` filter (convention C1), so the `gitleaks`
# job can be a required status check. Rules live in .gitleaks.toml.

on:
  pull_request:
    branches: [main]
  # Manual full-history scan, e.g. once after creating a repo from this template
  # or after importing history.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scan needs the common ancestor of base and branch, not only the
          # head commit.
          fetch-depth: 0

      # A release binary instead of gitleaks-action: version and checksum sit here in
      # plain text like every other pinned dependency. The checksum protects against
      # a broken download, not against a compromised release - the version pin is
      # responsible for that.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${file}"
          echo "${GITLEAKS_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks version

      # `--redact` is not a convenience: without it a finding writes the secret into
      # the run log and turns a near miss into a permanent one. A finding should say
      # where, not what.
      #
      # The PR scan covers only the PR range, not the whole history: a secret that
      # already sits in old history can only be fixed by revoking it, and a history
      # scan would be permanently red from the first run - a check that is always
      # red checks nothing and only teaches people to ignore it.
      - name: Scan the PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The base branch comes through env:, never interpolated into the script.
          # No separate `git fetch`: fetch-depth 0 already fetched all branches, and
          # without a stored checkout token (persist-credentials: false) a fetch in a
          # private repo could not authenticate anyway. rev-parse --verify makes the
          # step fail loudly if the base branch is missing after all.
          git rev-parse --verify -q "origin/${BASE_REF}" >/dev/null
          # merge-base instead of the reported base sha: after a force-push the base
          # commit GitHub reports is not necessarily an ancestor any more, the range
          # would then be empty - a silently green scan.
          base=$(git merge-base "origin/${BASE_REF}" HEAD)
          echo "Range: ${base}..HEAD"
          git log --oneline "${base}..HEAD" | sed 's/^/  /'
          ./gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="${base}..HEAD" \
            --redact --no-banner \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

      - name: Scan the full history
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          ./gitleaks git . \
            --config .gitleaks.toml \
            --redact --no-banner \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

      # The report is redacted even on a finding - it names file, line and rule,
      # not the value.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
