# Minimal ruleset: real bugs only (pyflakes, syntax/runtime errors, bugbear),
# no style or formatting rules - the codebase is not reformatted for CI.
target-version = "py310"
extend-exclude = [".claude", ".venv"]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
# zip() without strict=: the existing call sites zip two lists built together,
# and adding strict= would change behavior on a mismatch rather than fix a bug.
ignore = ["B905"]
